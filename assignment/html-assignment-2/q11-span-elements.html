<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Elements Example</title>
</head>
<body>
    <h1>Span Elements Example</h1>

    <!-- Three <span> elements labeling different parts of the sentence -->
    <p>
        <span title="Subject">Saksham</span> is
        <span title="Action">learning HTML</span> to build
        <span title="Goal">his first website</span>.
    </p>
</body>
</html>
