<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlink Example</title>
</head>
<body>
    <h1>Hyperlink Example</h1>

    <!-- Link to Google, opens in a new tab using target="_blank" -->
    <p>
        Click here to search on
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google</a>.
    </p>
</body>
</html>
