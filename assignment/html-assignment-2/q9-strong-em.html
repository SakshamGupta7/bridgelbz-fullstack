<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strong and Em Example</title>
</head>
<body>
    <h1>Strong and Em Example</h1>

    <!-- <strong> for importance, <em> for emphasis, in one sentence -->
    <p>
        You must <strong>submit the assignment</strong> before the deadline,
        or it will <em>not</em> be accepted.
    </p>
</body>
</html>
