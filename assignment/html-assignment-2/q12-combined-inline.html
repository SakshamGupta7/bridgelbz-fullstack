<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Combined Inline Formatting</title>
</head>
<body>
    <h1>Combined Inline Formatting</h1>

    <!-- Creative paragraph combining strong, em, mark, small, and br -->
    <p>
        <strong>Attention!</strong> The <em>final exam</em> is scheduled for
        next week.<br>
        Please review the <mark>syllabus</mark> carefully before then.
        <small>Updated recently</small>
    </p>
</body>
</html>
