<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Code Example</title>
</head>
<body>
    <h1>Inline Code Example</h1>

    <!-- <code> tag shows inline code snippet -->
    <p>
        To print "Hello World" in JavaScript, you write:
        <code>console.log("Hello World");</code>
    </p>
</body>
</html>
