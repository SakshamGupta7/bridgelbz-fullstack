<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mark and Small Example</title>
</head>
<body>
    <h1>Mark and Small Example</h1>

    <!-- <mark> highlights a word, <small> adds a small note at the end -->
    <p>
        Our next class will be held on <mark>Monday</mark> at 10 AM.
        <small>Updated recently</small>
    </p>
</body>
</html>
