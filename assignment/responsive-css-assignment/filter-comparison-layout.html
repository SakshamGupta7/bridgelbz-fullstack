<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q8: Filter Comparison Layout</title>
<link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
  <header>
    <h1>Before &amp; After Filter Comparison</h1>
  </header>

  <!-- Side-by-side comparison, Flexbox -->
  <main>
    <section class="compare-row">
      <figure class="compare-item">
        <img src="https://picsum.photos/id/1025/400/300" alt="Original image">
        <figcaption>Original</figcaption>
      </figure>
      <figure class="compare-item filtered">
        <img src="https://picsum.photos/id/1025/400/300" alt="Filtered image">
        <figcaption>Filtered (Brightness/Contrast)</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Responsive CSS Practice</p>
  </footer>
</body>
</html>
