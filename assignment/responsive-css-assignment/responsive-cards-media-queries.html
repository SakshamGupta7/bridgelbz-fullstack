<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q3: Responsive Cards with Media Queries</title>
<link rel="stylesheet" href="responsive-cards-media-queries.css">
</head>
<body>
  <header>
    <h1>Responsive Cards with Media Queries</h1>
  </header>

  <!-- Card row: Flexbox, changes columns via media queries -->
  <main>
    <section class="card-row">
      <article class="card">
        <h2>Card One</h2>
        <p>Desktop: 4 columns. Tablet: 2. Mobile: 1.</p>
      </article>
      <article class="card">
        <h2>Card Two</h2>
        <p>Hover to see the background color change.</p>
      </article>
      <article class="card">
        <h2>Card Three</h2>
        <p>Equal spacing and padding between cards.</p>
      </article>
      <article class="card">
        <h2>Card Four</h2>
        <p>Layout reflows using max-width breakpoints.</p>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Responsive CSS Practice</p>
  </footer>
</body>
</html>
