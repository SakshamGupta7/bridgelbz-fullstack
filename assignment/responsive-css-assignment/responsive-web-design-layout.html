<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q2: Responsive Web Design Layout</title>
<link rel="stylesheet" href="responsive-web-design-layout.css">
</head>
<body>
  <!-- Header: logo left, nav right, using Flexbox -->
  <header class="site-header">
    <div class="logo">BrandName</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main content: three feature boxes horizontally -->
  <main class="features">
    <section class="feature-box">
      <h2>Feature One</h2>
      <p>Fast performance across all devices.</p>
    </section>
    <section class="feature-box">
      <h2>Feature Two</h2>
      <p>Clean and modern responsive design.</p>
    </section>
    <section class="feature-box">
      <h2>Feature Three</h2>
      <p>Easy to maintain and extend.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 BrandName. All rights reserved.</p>
  </footer>
</body>
</html>
