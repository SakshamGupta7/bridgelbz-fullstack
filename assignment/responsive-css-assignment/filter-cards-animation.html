<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q5: Filter Cards with Animation</title>
<link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>
  <header>
    <h1>Filter Cards with Animation</h1>
  </header>

  <!-- Three profile cards, Flexbox layout -->
  <main>
    <section class="card-list">
      <article class="profile-card">
        <img src="https://picsum.photos/id/64/300/300" alt="Profile one">
        <h2>Alex Rivera</h2>
        <p>UI/UX Designer</p>
      </article>
      <article class="profile-card">
        <img src="https://picsum.photos/id/65/300/300" alt="Profile two">
        <h2>Jordan Lee</h2>
        <p>Frontend Developer</p>
      </article>
      <article class="profile-card">
        <img src="https://picsum.photos/id/91/300/300" alt="Profile three">
        <h2>Sam Patel</h2>
        <p>Product Manager</p>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Responsive CSS Practice</p>
  </footer>
</body>
</html>
