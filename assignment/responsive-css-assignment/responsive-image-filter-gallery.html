<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q1: Responsive Image Filter Gallery</title>
<link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <!-- Page header -->
  <header>
    <h1>Responsive Image Filter Gallery</h1>
  </header>

  <!-- Main gallery section using CSS Grid -->
  <main>
    <section class="gallery">
      <figure class="gallery-item blur">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river">
        <figcaption>Blur Filter</figcaption>
      </figure>
      <figure class="gallery-item grayscale">
        <img src="https://picsum.photos/id/1016/400/300" alt="Canyon">
        <figcaption>Grayscale Filter</figcaption>
      </figure>
      <figure class="gallery-item sepia">
        <img src="https://picsum.photos/id/1018/400/300" alt="Lake and mountains">
        <figcaption>Sepia Filter</figcaption>
      </figure>
      <figure class="gallery-item brightness">
        <img src="https://picsum.photos/id/1019/400/300" alt="Forest path">
        <figcaption>Brightness Filter</figcaption>
      </figure>
      <figure class="gallery-item contrast">
        <img src="https://picsum.photos/id/1021/400/300" alt="Hills">
        <figcaption>Contrast Filter</figcaption>
      </figure>
      <figure class="gallery-item hue-rotate">
        <img src="https://picsum.photos/id/1022/400/300" alt="Desert road">
        <figcaption>Hue-Rotate Filter</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Responsive CSS Practice</p>
  </footer>
</body>
</html>
